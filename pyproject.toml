[project]
name = "market-basket-analysis"
version = "1.0.0"
description = "Market-basket analysis and cross-sell engine for a B2B distributor (synthetic data, algorithms from scratch)"
authors = [{ name = "Dimitres Kisimov" }]
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
